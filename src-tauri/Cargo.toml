[package]
name = "preploop"
default-run = "PrepLoop"
autobins = false
version = "1.0.0"
description = "Free, open-source mock test application for competitive exams"
authors = ["Pradheep Vijayaraj"]
license = "GPL-3.0-only"
repository = "https://github.com/pradheepvijayaraj/prep-loop"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "PrepLoop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
rusqlite = { version = "0.32.1", features = ["serde_json"] }
serde_path_to_error = "0.1"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
fastembed = { version = "5.17.4", default-features = false, features = ["ort-download-binaries-rustls-tls"] }
