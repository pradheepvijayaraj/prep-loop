name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }} ${{ matrix.arch }} installers
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            arch: arm64
            runner: macos-latest
            bundles: app,dmg
          - platform: Windows
            arch: x64
            runner: windows-latest
            bundles: nsis,msi
          - platform: Windows
            arch: arm64
            runner: windows-11-arm
            bundles: nsis,msi
          - platform: Linux
            arch: x64
            runner: ubuntu-latest
            bundles: deb,rpm,appimage
          - platform: Linux
            arch: arm64
            runner: ubuntu-24.04-arm
            bundles: deb,rpm,appimage

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux bundling dependencies
        if: matrix.platform == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Build installers
        run: bunx tauri build --bundles ${{ matrix.bundles }}

      - name: Upload macOS installers
        if: matrix.platform == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: PrepLoop-macOS-${{ matrix.arch }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error

      - name: Upload Windows installers
        if: matrix.platform == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: PrepLoop-Windows-${{ matrix.arch }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error

      - name: Upload Linux AppImage
        if: matrix.platform == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: PrepLoop-Linux-${{ matrix.arch }}-AppImage
          path: src-tauri/target/release/bundle/appimage/
          if-no-files-found: error

      - name: Upload Linux DEB
        if: matrix.platform == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: PrepLoop-Linux-${{ matrix.arch }}-DEB
          path: src-tauri/target/release/bundle/deb/
          if-no-files-found: error

      - name: Upload Linux RPM
        if: matrix.platform == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: PrepLoop-Linux-${{ matrix.arch }}-RPM
          path: src-tauri/target/release/bundle/rpm/
          if-no-files-found: error
